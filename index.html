{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Where does the data come from, and how can a row be checked?","acceptedAnswer":{"@type":"Answer","text":"Every field is stored with the URL it was read from and the date. Checking a row means opening the links in that row. Registries come first, the company's own record second. Directories and aggregators are used to find companies, never to describe them."}},{"@type":"Question","name":"How is a map different from a contact database?","acceptedAnswer":{"@type":"Answer","text":"A contact database lists companies and people that exist. A map records, for a defined market, which companies buy a defined thing, what standing they hold, and what each statement rests on. The unit is the market, not the record."}},{"@type":"Question","name":"How is the boundary of a market defined?","acceptedAnswer":{"@type":"Answer","text":"By the buying criterion, written before work starts: who buys, or must buy, the thing in question, and in which jurisdiction. In the Singapore built-environment map the criterion is regulatory: which firms are required to submit building information models. The registry sets the population. The criterion sorts it."}},{"@type":"Question","name":"How are fields dated and refreshed?","acceptedAnswer":{"@type":"Answer","text":"Every field carries the date it was read. A map is re-read against its registries on a published cadence, and the date on each field shows what has been re-read and when."}},{"@type":"Question","name":"Can a map be built for a market that is not covered yet?","acceptedAnswer":{"@type":"Answer","text":"Yes. The method depends on the market having registries and companies that publish, not on the industry or the country. Lodestone reads one market at a time."}},{"@type":"Question","name":"What about data-protection law?","acceptedAnswer":{"@type":"Answer","text":"Sources are public or official, and the information held is company information and business roles. Each market is read within its own data-protection law. The source of every field is kept, so any entry can be traced and, where required, removed."}},{"@type":"Question","name":"How do I get a sample?","acceptedAnswer":{"@type":"Answer","text":"Use the form on the page. A sample is real rows from the market you name, with identifiers masked and the source link kept on every field."}}]}
